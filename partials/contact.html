<!-- CONTACT -->
<section id="contact">
  <div class="contact-inner">
    <div class="contact-header">
      <span class="section-label reveal">Open the Channel</span>
      <h2 class="section-heading reveal reveal-delay-1">Request a Consultation</h2>
      <div class="section-rule reveal reveal-delay-1"></div>
      <p class="reveal reveal-delay-2 section-intro">
        The first step is yours to take. Share what you carry, and we will begin.
      </p>
    </div>

    <!-- ✅ FIXED FORM -->
    <form action="https://formspree.io/f/mqegbdqe" method="POST" class="contact-form">
      <!-- spam protection -->
      <input type="text" name="_gotcha" class="field-honeypot">
      <input type="hidden" name="_next" value="">

      <div class="form-row">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name"
            placeholder="As you wish to be called"
            pattern="^[A-Za-z ]+$"
            title="Only letters and spaces allowed"
            required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email"
            placeholder="your@email.com"
            required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone"
            placeholder="10 digit number"
            pattern="[0-9]{10}"
            maxlength="10"
            title="Enter exactly 10 digits" />
        </div>

        <div class="form-group">
          <label for="service">Service Sought</label>
          <select id="service" name="service" required>
            <option value="" disabled selected>Choose your path</option>
            <option>Past • Present • Future Spread</option>
            <option>Five-Point Star Spread</option>
            <option>Super 7 Spread</option>
            <option>Harmony Spread</option>
            <option>Horoscope Wheel (12-House Spread)</option>
            <option>World Tree Spread</option>
            <option>Spiral Spread</option>
            <option>From Shadows Spread</option>
            <option>Mono Oracle Reading</option>
            <option>Shadow Work Session</option>
            <option>Love & Relationship Reading</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="question">Your Question or Intention</label>
        <textarea id="question" name="message"
          placeholder="What does your soul seek to understand?"
          required></textarea>
      </div>

      <button type="submit" class="btn-ritual">
        <span>✦ &nbsp; Send My Intention &nbsp; ✦</span>
      </button>

    </form>

    <div id="form-success-modal" class="form-success-modal" role="dialog" aria-modal="true" aria-labelledby="form-success-title" hidden>
      <div class="form-success-dialog">
        <p class="form-success-kicker">Transmission Received</p>
        <h3 id="form-success-title">Your intention has been sent.</h3>
        <p class="form-success-text">Thank you for reaching out. Your message is with us, and you will hear back soon.</p>
        <button type="button" class="btn-ritual form-success-ok" data-modal-close>
          <span>✦ &nbsp; Okay &nbsp; ✦</span>
        </button>
      </div>
    </div>
  </div>
</section>
